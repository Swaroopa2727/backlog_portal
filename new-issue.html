<!-- ============ MAIN CONTENT ============ -->
<main class="main-content">

  <div class="welcome-row">
    <div>
      <nav aria-label="breadcrumb" class="page-breadcrumb">
        <a href="all-issues.html"><i class="bi bi-arrow-left"></i> All Issues</a>
      </nav>
      <h2 class="page-title">New Issue</h2>
    </div>
  </div>

  <!-- New Issue form panel -->
  <section class="panel add-task-page">

    <form id="newIssueForm">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Issue Title</label>
          <input type="text" class="form-control" placeholder="e.g. Login not working on Safari">
        </div>
        <div class="col-md-4">
          <label class="form-label">Project</label>
          <select class="form-select">
            <option>Website Redesign</option>
            <option>Mobile App</option>
            <option>E-commerce Platform</option>
            <option>Internal Tool</option>
            <option>Document System</option>
            <option>Analytics Dashboard</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Issue Type</label>
          <select class="form-select">
            <option>Bug</option>
            <option>Task</option>
            <option>Feature</option>
            <option>Enhancement</option>
            <option>Documentation</option>
          </select>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Priority</label>
          <select class="form-select">
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select">
            <option selected>Open</option>
            <option>In Progress</option>
            <option>Resolved</option>
            <option>Closed</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Due Date</label>
          <input type="date" class="form-control">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Assignee</label>
          <select class="form-select">
            <option>Swaroopa Bhupathi</option>
            <option>Ram</option>
            <option>Priya</option>
            <option>Kiran</option>
            <option>Anu</option>
            <option>Siva</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Reporter</label>
          <select class="form-select">
            <option>Swaroopa Bhupathi</option>
            <option>Ram</option>
            <option>Priya</option>
            <option>Kiran</option>
            <option>Anu</option>
            <option>Siva</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tags</label>
          <input type="text" class="form-control" placeholder="e.g. Bug, UI, Integration">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" placeholder="Describe the issue in detail..."></textarea>
        </div>
      </div>

      <div class="add-task-page-actions">
        <a href="all-issues.html" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-new">
          <i class="bi bi-plus-lg me-2"></i>Create Issue
        </button>
      </div>
    </form>
  </section>

<script>
  // Simple demo submit handler — redirects back to All Issues after "saving"
  document.getElementById("newIssueForm").addEventListener("submit", function (e) {
    e.preventDefault();
    window.location.href = "all-issues.html";
  });
</script>
